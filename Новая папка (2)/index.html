<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B2D5B">
<title>VALORA — Información de pago</title>

<style>
:root{
    --navy:#0B2D5B;
    --blue:#1E6BFF;
    --green:#00C896;
    --ice:#EAF4FF;
    --white:#ffffff;
    --text:#10213b;
    --muted:#65758b;
    --line:#dbe6f2;
    --shadow:0 20px 60px rgba(11,45,91,.13);
    --radius:24px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 10% 0%,rgba(30,107,255,.11),transparent 30%),
        radial-gradient(circle at 90% 10%,rgba(0,200,150,.10),transparent 25%),
        #f6f9fd;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:min(1120px,calc(100% - 32px));
    margin:auto;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(219,230,242,.8);
}

.nav{
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand img{
    width:190px;
    max-width:48vw;
    display:block;
}

.support-top{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    background:var(--navy);
    color:white;
    padding:12px 17px;
    border-radius:13px;
    font-weight:700;
    font-size:14px;
    transition:.2s;
}

.support-top:hover{
    transform:translateY(-1px);
    background:#123d76;
}

/* HERO */

.hero{
    padding:70px 0 35px;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.05fr .95fr;
    gap:42px;
    align-items:center;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border-radius:999px;
    background:var(--ice);
    color:var(--navy);
    font-weight:800;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 5px rgba(0,200,150,.12);
}

h1{
    font-size:clamp(36px,5vw,62px);
    line-height:1.02;
    letter-spacing:-.045em;
    margin:20px 0 16px;
    color:var(--navy);
}

.hero p{
    font-size:18px;
    line-height:1.65;
    color:var(--muted);
    max-width:650px;
}

.hero-actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:28px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    border:0;
    border-radius:14px;
    padding:14px 19px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.btn-primary{
    background:linear-gradient(135deg,var(--blue),#1553d6);
    color:#fff;
    box-shadow:0 12px 28px rgba(30,107,255,.25);
}

.btn-secondary{
    background:#fff;
    color:var(--navy);
    border:1px solid var(--line);
}

.btn:hover{
    transform:translateY(-2px);
}

/* HERO CARD */

.hero-card{
    background:linear-gradient(145deg,#0b2d5b,#071d3d);
    border-radius:32px;
    padding:28px;
    color:white;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
    min-height:300px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.hero-card:before,
.hero-card:after{
    content:"";
    position:absolute;
    border:1px solid rgba(255,255,255,.12);
    border-radius:50%;
}

.hero-card:before{
    width:320px;
    height:320px;
    right:-140px;
    top:-140px;
}

.hero-card:after{
    width:230px;
    height:230px;
    left:-130px;
    bottom:-130px;
}

.mini-logo{
    width:72px;
    height:72px;
    border-radius:20px;
    background:rgba(255,255,255,.09);
    padding:13px;
    position:relative;
    z-index:1;
}

.mini-logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.hero-card h3{
    font-size:26px;
    margin:22px 0 7px;
    position:relative;
    z-index:1;
}

.hero-card p{
    color:rgba(255,255,255,.72);
    font-size:14px;
    line-height:1.55;
    position:relative;
    z-index:1;
}

/* PAYMENT */

.section{
    padding:35px 0 80px;
}

.section-title{
    margin-bottom:20px;
}

.section-title h2{
    font-size:32px;
    letter-spacing:-.03em;
    color:var(--navy);
    margin:0 0 8px;
}

.section-title p{
    margin:0;
    color:var(--muted);
}

.payment-grid{
    display:grid;
    grid-template-columns:1fr .8fr;
    gap:22px;
    align-items:stretch;
}

.card{
    background:white;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 10px 35px rgba(11,45,91,.07);
    padding:26px;
}

.card h3{
    margin:0 0 20px;
    color:var(--navy);
    font-size:21px;
}

.details{
    display:grid;
    gap:12px;
}

.detail{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:15px 0;
    border-bottom:1px solid #edf2f7;
}

.detail:last-child{
    border-bottom:0;
}

.detail-label{
    color:var(--muted);
    font-size:14px;
}

.detail-value{
    text-align:right;
    word-break:break-word;
    font-size:14px;
}

.copy-btn{
    margin-left:8px;
    border:1px solid var(--line);
    background:#f8fbff;
    color:var(--blue);
    border-radius:9px;
    padding:5px 8px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
}

.amount{
    margin-top:18px;
    background:linear-gradient(135deg,var(--ice),#f7fffc);
    border:1px solid #d8ebff;
    border-radius:18px;
    padding:18px;
}

.amount-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    font-weight:800;
}

.amount-value{
    font-size:32px;
    color:var(--navy);
    font-weight:900;
    margin-top:3px;
}

/* QR */

.qr-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.qr-box{
    width:min(310px,100%);
    aspect-ratio:1;
    background:#fff;
    border:1px dashed #b7c9de;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:14px;
}

.qr-box img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:none;
}

.qr-placeholder{
    color:var(--muted);
    padding:25px;
}

.qr-icon{
    font-size:46px;
    margin-bottom:10px;
    color:var(--blue);
}

.qr-caption{
    margin:17px 0 0;
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
}

/* AFTER PAYMENT */

.notice{
    margin-top:22px;
    border-radius:20px;
    padding:22px;
    background:linear-gradient(135deg,#ecfbf7,#eef5ff);
    border:1px solid #d6eee8;
    display:flex;
    gap:16px;
    align-items:flex-start;
}

.notice-icon{
    width:42px;
    height:42px;
    border-radius:13px;
    background:#fff;
    display:grid;
    place-items:center;
    font-size:20px;
    flex:0 0 auto;
}

.notice h3{
    margin:0 0 5px;
    color:var(--navy);
    font-size:17px;
}

.notice p{
    margin:0;
    color:#53657c;
    line-height:1.55;
    font-size:14px;
}

.notice .btn{
    margin-top:13px;
}

/* FOOTER */

footer{
    padding:30px 0 45px;
    color:#74849a;
    font-size:13px;
    text-align:center;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%,20px);
    background:#0b2d5b;
    color:#fff;
    padding:11px 16px;
    border-radius:12px;
    font-size:13px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:80;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* MOBILE */

@media(max-width:820px){
    .hero-grid,
    .payment-grid{
        grid-template-columns:1fr;
    }

    .hero{
        padding-top:45px;
    }

    .hero-card{
        min-height:240px;
    }
}

@media(max-width:560px){
    .container{
        width:min(100% - 22px,1120px);
    }

    .nav{
        height:68px;
    }

    .brand img{
        width:160px;
    }

    .support-top{
        padding:10px 12px;
        font-size:12px;
    }

    .card{
        padding:19px;
    }

    h1{
        font-size:39px;
    }

    .detail{
        display:grid;
        gap:5px;
    }

    .detail-value{
        text-align:left;
    }

    .notice{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header>
    <div class="container nav">

        <a href="#" class="brand" aria-label="VALORA">
            <img src="assets/valora-logo.png" alt="VALORA">
        </a>

        <a
            id="topSupport"
            class="support-top"
            href="#"
            target="_blank"
            rel="noopener"
        >
            💬 Soporte
        </a>

    </div>
</header>


<main>

    <section class="hero">

        <div class="container hero-grid">

            <div>

                <span class="eyebrow">
                    <span class="dot"></span>
                    <span id="eyebrowText"></span>
                </span>

                <h1 id="pageTitle"></h1>

                <p id="pageDescription"></p>

                <div class="hero-actions">

                    <a
                        id="heroSupport"
                        class="btn btn-primary"
                        href="#"
                        target="_blank"
                        rel="noopener"
                    >
                        💬 Enviar comprobante
                    </a>

                    <a
                        class="btn btn-secondary"
                        href="#payment"
                    >
                        Ver datos de pago ↓
                    </a>

                </div>

            </div>


            <div class="hero-card">

                <div class="mini-logo">
                    <img src="assets/valora-logo.png" alt="">
                </div>

                <div>

                    <h3 id="heroCardTitle"></h3>

                    <p id="heroCardText"></p>

                </div>

            </div>

        </div>

    </section>


    <section class="section" id="payment">

        <div class="container">

            <div class="section-title">

                <h2 id="paymentTitle"></h2>

                <p id="paymentSubtitle"></p>

            </div>


            <div class="payment-grid">


                <!-- BANK DETAILS -->

                <div class="card">

                    <h3 id="bankSectionTitle"></h3>

                    <div class="details" id="details"></div>

                    <div class="amount">

                        <div
                            class="amount-label"
                            id="amountLabel"
                        ></div>

                        <div
                            class="amount-value"
                            id="amountValue"
                        ></div>

                    </div>

                </div>


                <!-- QR -->

                <div class="card qr-wrap">

                    <h3 id="qrTitle"></h3>

                    <div class="qr-box">

                        <img
                            id="qrImage"
                            alt="Código QR de pago"
                        >

                        <div
                            id="qrPlaceholder"
                            class="qr-placeholder"
                        >

                            <div class="qr-icon">▦</div>

                            <strong>QR</strong>

                            <div>
                                Добавь QR-код в папку assets.
                            </div>

                        </div>

                    </div>

                    <p
                        class="qr-caption"
                        id="qrDescription"
                    ></p>

                </div>

            </div>


            <!-- AFTER PAYMENT -->

            <div class="notice">

                <div class="notice-icon">
                    ✓
                </div>

                <div>

                    <h3 id="afterPaymentTitle"></h3>

                    <p id="afterPaymentText"></p>

                    <a
                        id="afterPaymentButton"
                        class="btn btn-primary"
                        href="#"
                        target="_blank"
                        rel="noopener"
                    ></a>

                </div>

            </div>

        </div>

    </section>

</main>


<footer>

    <div
        class="container"
        id="footerText"
    ></div>

</footer>


<div
    class="toast"
    id="toast"
>
    Скопировано
</div>


<script src="config.js"></script>

<script>

function $(id){
    return document.getElementById(id);
}


function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


async function copyText(value){

    try{

        await navigator.clipboard.writeText(value);

        showToast("Скопировано");

    }catch{

        const textarea = document.createElement("textarea");

        textarea.value = value;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        showToast("Скопировано");

    }

}


function showToast(text){

    const toast = $("toast");

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(
        () => toast.classList.remove("show"),
        1800
    );

}


function render(){

    document.title = `VALORA — ${CONFIG.paymentTitle}`;

    $("eyebrowText").textContent =
        CONFIG.eyebrow;

    $("pageTitle").textContent =
        CONFIG.pageTitle;

    $("pageDescription").textContent =
        CONFIG.pageDescription;

    $("heroCardTitle").textContent =
        CONFIG.heroCardTitle;

    $("heroCardText").textContent =
        CONFIG.heroCardText;

    $("paymentTitle").textContent =
        CONFIG.paymentTitle;

    $("paymentSubtitle").textContent =
        CONFIG.paymentSubtitle;

    $("bankSectionTitle").textContent =
        CONFIG.bankSectionTitle;

    $("amountLabel").textContent =
        CONFIG.amountLabel;

    $("qrTitle").textContent =
        CONFIG.qrTitle;

    $("qrDescription").textContent =
        CONFIG.qrDescription;

    $("afterPaymentTitle").textContent =
        CONFIG.afterPaymentTitle;

    $("afterPaymentText").textContent =
        CONFIG.afterPaymentText;

    $("footerText").textContent =
        CONFIG.footer;


    // Telegram buttons

    $("topSupport").href =
        CONFIG.telegram;

    $("topSupport").textContent =
        CONFIG.topSupportButton;

    $("heroSupport").href =
        CONFIG.telegram;

    $("heroSupport").textContent =
        CONFIG.sendReceiptButton;

    $("afterPaymentButton").href =
        CONFIG.telegram;

    $("afterPaymentButton").textContent =
        CONFIG.supportButton;


    // Amount

    $("amountValue").textContent =
        `${CONFIG.amount} ${CONFIG.currency}`;


    // Bank details

    const rows = [

        ["Banco", CONFIG.bank],

        ["Titular", CONFIG.accountHolder],

        ["Número de cuenta", CONFIG.accountNumber],

        ["IBAN", CONFIG.iban],

        ["SWIFT / BIC", CONFIG.swift],

        ["Referencia", CONFIG.reference]

    ];


    $("details").innerHTML = rows.map(
        ([label,value]) => `

            <div class="detail">

                <span class="detail-label">
                    ${escapeHtml(label)}
                </span>

                <strong class="detail-value">

                    ${escapeHtml(value || "—")}

                    ${
                        value
                        ?
                        `<button
                            class="copy-btn"
                            type="button"
                            onclick='copyText(${JSON.stringify(String(value))})'
                        >
                            Copiar
                        </button>`
                        :
                        ""
                    }

                </strong>

            </div>

        `
    ).join("");


    // QR

    const qrImage =
        $("qrImage");

    const placeholder =
        $("qrPlaceholder");


    if(CONFIG.qrImage){

        qrImage.src =
            CONFIG.qrImage;

        qrImage.style.display =
            "block";

        placeholder.style.display =
            "none";

        qrImage.onerror =
            function(){

                qrImage.style.display =
                    "none";

                placeholder.style.display =
                    "block";

            };

    }else{

        qrImage.style.display =
            "none";

        placeholder.style.display =
            "block";

    }

}


render();

</script>

</body>
</html>
