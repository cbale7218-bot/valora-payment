<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA — Información de pago</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --navy:#071d3d;
    --navy2:#0b2d5b;
    --blue:#176bff;
    --blue2:#4c8cff;
    --green:#00c896;
    --bg:#f4f8fc;
    --white:#fff;
    --text:#102f52;
    --muted:#71849b;
    --border:#dfe8f2;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
    background:
        radial-gradient(
            circle at 90% 5%,
            rgba(23,107,255,.13),
            transparent 28%
        ),
        radial-gradient(
            circle at 5% 55%,
            rgba(0,200,150,.08),
            transparent 24%
        ),
        var(--bg);
    min-height:100vh;
}

a,
button{
    font-family:inherit;
}

header{
    position:relative;
    z-index:20;
    background:rgba(255,255,255,.9);
    border-bottom:1px solid rgba(223,232,242,.8);
    backdrop-filter:blur(14px);
}

.header-inner{
    max-width:1220px;
    margin:auto;
    padding:18px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
}

.logo-symbol{
    width:43px;
    height:43px;
    border-radius:13px;
    overflow:hidden;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 22px rgba(23,107,255,.12);
}

.logo-symbol img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.logo-text{
    font-size:28px;
    line-height:1;
    font-weight:900;
    letter-spacing:.3px;
    color:var(--navy);
}

.logo-text span{
    color:var(--green);
}

.logo-subtitle{
    margin-top:5px;
    color:var(--muted);
    font-size:8px;
    letter-spacing:1px;
    font-weight:700;
}

.header-button{
    text-decoration:none;
    color:#fff;
    background:var(--navy);
    padding:12px 20px;
    border-radius:12px;
    font-size:13px;
    font-weight:800;
    transition:.25s;
}

.header-button:hover{
    background:var(--blue);
    transform:translateY(-2px);
}


/* MAIN */

main{
    max-width:1220px;
    margin:auto;
    padding:78px 30px 100px;
}


/* HERO */

.hero{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:65px;
    align-items:center;
    margin-bottom:85px;
}

.hero-left{
    animation:fadeUp .7s ease both;
}

.hero-label{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:9px 15px;
    border-radius:30px;
    background:#eaf3ff;
    border:1px solid #dbe9fb;
    color:var(--blue);
    font-size:11px;
    font-weight:900;
    letter-spacing:.8px;
    text-transform:uppercase;
    margin-bottom:25px;
}

.hero-label::before{
    content:"";
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--green);
    box-shadow:
        0 0 0 5px rgba(0,200,150,.1),
        0 0 15px rgba(0,200,150,.3);
}

.hero h1{
    max-width:690px;
    color:var(--navy);
    font-size:67px;
    line-height:1;
    letter-spacing:-3px;
    margin-bottom:25px;
    font-weight:900;
}

.hero-description{
    max-width:610px;
    color:#667f9d;
    font-size:17px;
    line-height:1.65;
    margin-bottom:30px;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.primary-button,
.secondary-button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:15px 22px;
    border-radius:13px;
    text-decoration:none;
    font-size:13px;
    font-weight:800;
    transition:.25s;
}

.primary-button{
    color:#fff;
    background:linear-gradient(
        135deg,
        var(--blue),
        var(--blue2)
    );
    box-shadow:0 12px 28px rgba(23,107,255,.22);
}

.primary-button:hover,
.secondary-button:hover{
    transform:translateY(-3px);
}

.secondary-button{
    color:var(--navy);
    background:#fff;
    border:1px solid var(--border);
}


/* HERO VISUAL */

.hero-visual{
    position:relative;
    min-height:390px;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:fadeUp .8s .1s ease both;
}

.glow{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:rgba(23,107,255,.15);
    filter:blur(60px);
}

.finance-card{
    width:min(470px,100%);
    min-height:295px;
    position:relative;
    overflow:hidden;
    border-radius:30px;
    padding:30px;
    color:#fff;

    background:
        radial-gradient(
            circle at 88% 12%,
            rgba(76,140,255,.4),
            transparent 30%
        ),
        radial-gradient(
            circle at 5% 95%,
            rgba(0,200,150,.18),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            #0d376c,
            #061a35
        );

    box-shadow:
        0 35px 75px rgba(7,29,61,.22),
        inset 0 1px 0 rgba(255,255,255,.1);

    transform:rotate(2deg);
    transition:.4s ease;
}

.finance-card:hover{
    transform:rotate(0deg) translateY(-6px);
}

.finance-card::before{
    content:"";
    position:absolute;
    width:370px;
    height:370px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
    right:-180px;
    top:-180px;
}

.finance-card::after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border:1px solid rgba(255,255,255,.05);
    border-radius:50%;
    left:-130px;
    bottom:-130px;
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
    z-index:2;
}

.card-brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.card-brand img{
    width:43px;
    height:43px;
    object-fit:contain;
    border-radius:11px;
    background:rgba(255,255,255,.08);
}

.card-brand-name{
    font-size:20px;
    font-weight:900;
    letter-spacing:.3px;
}

.card-brand-name span{
    color:var(--green);
}

.card-status{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 10px;
    border-radius:20px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);
    font-size:9px;
    font-weight:800;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px rgba(0,200,150,.7);
}

.card-center{
    position:relative;
    z-index:2;
    margin-top:60px;
}

.card-small{
    color:#a9bfd8;
    text-transform:uppercase;
    font-size:9px;
    letter-spacing:1px;
    font-weight:800;
    margin-bottom:7px;
}

.card-amount{
    font-size:37px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.card-bottom{
    position:absolute;
    bottom:27px;
    left:30px;
    right:30px;
    z-index:2;
    display:flex;
    justify-content:space-between;
    color:#abc0d8;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.8px;
    font-weight:800;
}

.floating-mark{
    position:absolute;
    right:8%;
    bottom:4%;
    width:75px;
    height:75px;
    border-radius:22px;
    background:#fff;
    box-shadow:0 20px 45px rgba(7,29,61,.14);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
    animation:float 4s ease-in-out infinite;
}

.floating-mark img{
    width:60px;
    height:60px;
    object-fit:contain;
}


/* PAYMENT */

.payment-heading{
    margin-bottom:24px;
}

.payment-heading h2{
    color:var(--navy);
    font-size:36px;
    letter-spacing:-1.5px;
    margin-bottom:8px;
}

.payment-heading p{
    color:var(--muted);
    font-size:14px;
}

.payment-layout{
    display:grid;
    grid-template-columns:1.4fr .8fr;
    gap:22px;
}

.card{
    background:rgba(255,255,255,.95);
    border:1px solid var(--border);
    border-radius:25px;
    padding:30px;
    box-shadow:0 18px 50px rgba(7,29,61,.06);
    transition:.3s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 25px 60px rgba(7,29,61,.09);
}

.card-title{
    color:var(--navy);
    font-size:22px;
    margin-bottom:23px;
    font-weight:900;
}

.details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.detail{
    padding:17px;
    background:
        linear-gradient(
            145deg,
            #f9fbfe,
            #f3f7fb
        );
    border:1px solid var(--border);
    border-radius:15px;
    transition:.25s;
}

.detail:hover{
    transform:translateY(-2px);
    border-color:#cbdbea;
}

.detail-label{
    display:block;
    color:#8194a9;
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.8px;
    margin-bottom:8px;
}

.detail-value{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    color:var(--navy);
    font-size:14px;
    font-weight:900;
    word-break:break-word;
}

.copy-btn{
    flex-shrink:0;
    border:0;
    background:#eaf2ff;
    color:var(--blue);
    padding:7px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:10px;
    font-weight:900;
    transition:.2s;
}

.copy-btn:hover{
    color:#fff;
    background:var(--blue);
}

.amount-box{
    margin-top:18px;
    padding:24px;
    border-radius:19px;
    background:
        radial-gradient(
            circle at 95% 10%,
            rgba(0,200,150,.12),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #eefaf7,
            #f0f6ff
        );
    border:1px solid #d4e9e4;
}

.amount-label{
    color:#7187a0;
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.8px;
    margin-bottom:6px;
}

.amount-value{
    color:var(--navy);
    font-size:31px;
    font-weight:900;
    letter-spacing:-1px;
}


/* INFO */

.info-card{
    background:
        radial-gradient(
            circle at 100% 0%,
            rgba(0,200,150,.1),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #f0faf7,
            #eff5ff
        );
}

.info-icon{
    width:52px;
    height:52px;
    border-radius:16px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--green);
    font-size:24px;
    font-weight:900;
    margin-bottom:23px;
    box-shadow:0 10px 25px rgba(0,200,150,.09);
}

.info-card h3{
    color:var(--navy);
    font-size:22px;
    margin-bottom:11px;
}

.info-card p{
    color:#657f9c;
    font-size:14px;
    line-height:1.7;
}


/* AFTER PAYMENT */

.after-payment{
    margin-top:22px;
    padding:29px 30px;
    border-radius:25px;
    color:#fff;

    background:
        radial-gradient(
            circle at 85% 0%,
            rgba(23,107,255,.25),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #071d3d,
            #0b2d5b
        );

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;

    box-shadow:0 20px 50px rgba(7,29,61,.15);
}

.after-payment h3{
    font-size:21px;
    margin-bottom:7px;
}

.after-payment p{
    color:#b9cce0;
    line-height:1.6;
    font-size:13px;
}

.support-button{
    flex-shrink:0;
    color:#fff;
    background:var(--blue);
    text-decoration:none;
    padding:14px 22px;
    border-radius:12px;
    font-size:13px;
    font-weight:900;
    transition:.25s;
}

.support-button:hover{
    transform:translateY(-2px);
    background:var(--blue2);
}


/* FOOTER */

footer{
    text-align:center;
    padding:31px;
    color:#8092a8;
    font-size:11px;
    border-top:1px solid var(--border);
    background:#fff;
}

.footer-logo{
    font-size:20px;
    font-weight:900;
    color:var(--navy);
    margin-bottom:7px;
}

.footer-logo span{
    color:var(--green);
}


/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy);
    color:#fff;
    padding:11px 18px;
    border-radius:11px;
    font-size:13px;
    font-weight:800;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:9999;
    box-shadow:0 12px 30px rgba(7,29,61,.18);
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}


/* ANIMATIONS */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}


/* MOBILE */

@media(max-width:850px){

    main{
        padding:55px 18px 70px;
    }

    .header-inner{
        padding:16px 18px;
    }

    .hero{
        grid-template-columns:1fr;
        gap:35px;
        margin-bottom:60px;
    }

    .hero h1{
        font-size:49px;
        letter-spacing:-2.5px;
    }

    .hero-description{
        font-size:15px;
    }

    .hero-visual{
        min-height:340px;
    }

    .finance-card{
        transform:none;
    }

    .finance-card:hover{
        transform:translateY(-4px);
    }

    .payment-layout{
        grid-template-columns:1fr;
    }

    .details{
        grid-template-columns:1fr;
    }

    .after-payment{
        flex-direction:column;
        align-items:flex-start;
    }

    .support-button{
        width:100%;
        text-align:center;
    }
}

@media(max-width:500px){

    .header-inner{
        padding:14px;
    }

    .logo-symbol{
        width:39px;
        height:39px;
    }

    .logo-text{
        font-size:22px;
    }

    .logo-subtitle{
        font-size:7px;
    }

    .header-button{
        padding:10px 12px;
        font-size:10px;
    }

    .hero h1{
        font-size:39px;
        letter-spacing:-2px;
    }

    .hero-actions{
        flex-direction:column;
    }

    .primary-button,
    .secondary-button{
        width:100%;
    }

    .hero-visual{
        min-height:290px;
    }

    .finance-card{
        min-height:270px;
        padding:23px;
        border-radius:25px;
    }

    .card-center{
        margin-top:50px;
    }

    .card-amount{
        font-size:31px;
    }

    .floating-mark{
        width:60px;
        height:60px;
        right:2%;
    }

    .floating-mark img{
        width:48px;
        height:48px;
    }

    .card{
        padding:21px;
    }

    .payment-heading h2{
        font-size:29px;
    }

    .amount-value{
        font-size:27px;
    }
}
</style>
</head>

<script>

function $(id){
    return document.getElementById(id);
}

function esc(value){

    return String(value ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
}

async function copyText(value){

    try{

        await navigator.clipboard.writeText(value);

        showToast('Copiado');

    }catch(e){

        const textarea =
            document.createElement('textarea');

        textarea.value = value;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand('copy');

        textarea.remove();

        showToast('Copiado');
    }
}

function showToast(text){

    const toast = $('toast');

    toast.textContent = text;

    toast.classList.add('show');

    clearTimeout(window._toast);

    window._toast = setTimeout(
        () => toast.classList.remove('show'),
        1800
    );
}

function render(C){

    document.title =
        `VALORA — ${C.paymentTitle || 'Información de pago'}`;

    $('eyebrowText').textContent =
        C.eyebrow || '';

    $('pageTitle').textContent =
        C.pageTitle || '';

    $('pageDescription').textContent =
        C.pageDescription || '';

    $('heroCardTitle').textContent =
        C.heroCardTitle || '';

    $('paymentTitle').textContent =
        C.paymentTitle || '';

    $('paymentSubtitle').textContent =
        C.paymentSubtitle || '';

    $('bankSectionTitle').textContent =
        C.bankSectionTitle || 'Información bancaria';

    $('amountLabel').textContent =
        C.amountLabel || 'Importe';

    $('afterPaymentTitle').textContent =
        C.afterPaymentTitle || '';

    $('afterPaymentText').textContent =
        C.afterPaymentText || '';

    $('footerText').textContent =
        C.footer || '';


    $('topSupport').href =
        C.telegram || '#';

    $('topSupport').textContent =
        C.topSupportButton || 'Contactar';


    $('heroSupport').href =
        C.telegram || '#';

    $('heroSupport').textContent =
        C.sendReceiptButton || 'Enviar comprobante';


    $('afterPaymentButton').href =
        C.telegram || '#';

    $('afterPaymentButton').textContent =
        C.supportButton || 'Contactar soporte';


    $('amountValue').textContent =
        `${C.amount || '—'} ${C.currency || ''}`;


    const rows = [

        ['Banco', C.bank],

        ['Titular', C.accountHolder],

        ['Número de cuenta', C.accountNumber],

        ['Cédula', C.swift],

        ['Referencia', C.reference]

    ];


    $('details').innerHTML = rows.map(
        ([label,value]) => `

        <div class="detail">

            <span class="detail-label">
                ${esc(label)}
            </span>

            <div class="detail-value">

                <span>
                    ${esc(value || '—')}
                </span>

                ${
                    value
                    ?
                    `<button
                        class="copy-btn"
                        type="button"
                        onclick='copyText(${JSON.stringify(String(value))})'
                    >
                        Copiar
                    </button>`
                    :
                    ''
                }

            </div>

        </div>

        `
    ).join('');
}


if(typeof loadConfig === 'function'){

    loadConfig()
        .then(render)
        .catch(error => {

            console.error(
                'Error al cargar la configuración:',
                error
            );

        });

}else{

    console.error(
        'No se encontró loadConfig(). Revisa config.js'
    );

}

</script>

</body>
</html>
