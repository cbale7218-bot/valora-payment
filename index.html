<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORA — Información de pago</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --navy:#0b2d5b;
    --navy-dark:#071d3d;
    --blue:#1e6bff;
    --green:#00c896;
    --soft:#eef5ff;
    --text:#12345b;
    --muted:#7185a0;
    --border:#dbe7f3;
    --white:#ffffff;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(
            circle at 90% 5%,
            rgba(30,107,255,.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 10% 65%,
            rgba(0,200,150,.08),
            transparent 25%
        ),
        #f5f9fd;
    color:var(--text);
    min-height:100vh;
}

button,
a{
    font-family:inherit;
}

header{
    width:100%;
    background:#fff;
    border-bottom:1px solid var(--border);
}

.header-inner{
    max-width:1220px;
    margin:auto;
    padding:20px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-symbol{
    width:42px;
    height:42px;
    border-radius:12px;
    background:linear-gradient(
        135deg,
        #1767ff,
        #0f4fcf
    );
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-symbol::before{
    content:"V";
    color:#fff;
    font-size:27px;
    font-weight:900;
    transform:skew(-8deg);
}

.logo-text{
    font-size:29px;
    font-weight:900;
    letter-spacing:.5px;
    color:var(--navy);
}

.logo-text span{
    color:var(--green);
}

.logo-subtitle{
    font-size:9px;
    color:var(--muted);
    margin-top:-3px;
    letter-spacing:.7px;
}

.header-button{
    text-decoration:none;
    background:var(--navy);
    color:#fff;
    padding:12px 20px;
    border-radius:12px;
    font-size:14px;
    font-weight:700;
}

main{
    max-width:1220px;
    margin:auto;
    padding:80px 30px 100px;
}

.hero{
    display:grid;
    grid-template-columns:1.05fr .95fr;
    gap:70px;
    align-items:center;
    margin-bottom:80px;
}

.hero-label{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#eaf4ff;
    color:var(--navy);
    border-radius:30px;
    padding:8px 14px;
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.4px;
    margin-bottom:28px;
}

.hero-label::before{
    content:"";
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 5px rgba(0,200,150,.12);
}

.hero h1{
    font-size:68px;
    line-height:.98;
    letter-spacing:-3px;
    color:var(--navy);
    margin-bottom:25px;
    max-width:680px;
}

.hero-description{
    font-size:18px;
    line-height:1.6;
    color:#64809f;
    max-width:620px;
    margin-bottom:30px;
}

.hero-actions{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
}

.primary-button,
.secondary-button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    padding:16px 24px;
    border-radius:15px;
    font-weight:800;
    font-size:15px;
    transition:.2s;
}

.primary-button{
    background:var(--blue);
    color:#fff;
    box-shadow:0 12px 28px rgba(30,107,255,.2);
}

.secondary-button{
    background:#fff;
    color:var(--navy);
    border:1px solid var(--border);
}

.primary-button:hover,
.secondary-button:hover{
    transform:translateY(-2px);
}

.hero-card{
    min-height:340px;
    border-radius:34px;
    padding:32px;
    background:
        radial-gradient(
            circle at 90% 0%,
            rgba(255,255,255,.08),
            transparent 30%
        ),
        var(--navy-dark);
    color:#fff;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
}

.hero-card::after{
    content:"";
    position:absolute;
    width:330px;
    height:330px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:50%;
    right:-120px;
    top:-120px;
}

.hero-card-logo{
    position:absolute;
    top:32px;
    left:32px;
    width:80px;
    height:80px;
    border-radius:22px;
    background:rgba(255,255,255,.09);
    display:flex;
    align-items:center;
    justify-content:center;
}

.hero-card-logo::before{
    content:"V";
    font-size:40px;
    font-weight:900;
    color:#1e6bff;
}

.hero-card h2{
    position:relative;
    z-index:2;
    font-size:29px;
    margin-bottom:12px;
}

.hero-card p{
    position:relative;
    z-index:2;
    color:#d5e2f2;
    line-height:1.5;
}

.payment-heading{
    margin-bottom:25px;
}

.payment-heading h2{
    font-size:36px;
    color:var(--navy);
    margin-bottom:8px;
}

.payment-heading p{
    color:var(--muted);
    font-size:16px;
}

.payment-layout{
    display:grid;
    grid-template-columns:1.4fr .8fr;
    gap:24px;
}

.card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:25px;
    padding:30px;
    box-shadow:0 12px 35px rgba(11,45,91,.05);
}

.card-title{
    font-size:23px;
    color:var(--navy);
    margin-bottom:25px;
}

.details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.detail{
    padding:18px;
    background:#f7faff;
    border:1px solid var(--border);
    border-radius:15px;
}

.detail-label{
    display:block;
    color:#7890aa;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.7px;
    margin-bottom:9px;
}

.detail-value{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    color:var(--navy);
    font-size:15px;
    font-weight:800;
    word-break:break-word;
}

.copy-btn{
    flex-shrink:0;
    border:0;
    background:#eaf2ff;
    color:var(--blue);
    padding:8px 11px;
    border-radius:8px;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
}

.copy-btn:hover{
    background:var(--blue);
    color:#fff;
}

.amount-box{
    margin-top:20px;
    padding:24px;
    border-radius:18px;
    background:linear-gradient(
        135deg,
        #eef9f7,
        #f1f7ff
    );
    border:1px solid #d6ebe7;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.amount-label{
    color:#7187a0;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.8px;
    margin-bottom:7px;
}

.amount-value{
    font-size:30px;
    font-weight:900;
    color:var(--navy);
}

.info-card{
    background:linear-gradient(
        145deg,
        #edf9f7,
        #eef5ff
    );
    border:1px solid #d6e9e7;
}

.info-icon{
    width:52px;
    height:52px;
    border-radius:15px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--green);
    font-size:25px;
    font-weight:900;
    margin-bottom:25px;
}

.info-card h3{
    font-size:22px;
    color:var(--navy);
    margin-bottom:12px;
}

.info-card p{
    color:#647f9d;
    line-height:1.6;
}

.after-payment{
    margin-top:24px;
    background:var(--navy-dark);
    color:#fff;
    border-radius:25px;
    padding:30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.after-payment h3{
    font-size:22px;
    margin-bottom:8px;
}

.after-payment p{
    color:#b8cbe0;
    line-height:1.5;
}

.support-button{
    flex-shrink:0;
    text-decoration:none;
    background:var(--blue);
    color:#fff;
    padding:14px 22px;
    border-radius:13px;
    font-weight:800;
}

footer{
    text-align:center;
    padding:30px;
    color:#8092a8;
    font-size:12px;
    border-top:1px solid var(--border);
    background:#fff;
}

.footer-logo{
    font-size:20px;
    font-weight:900;
    color:var(--navy);
    margin-bottom:7px;
}

.footer-logo span{
    color:var(--green);
}

.toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy-dark);
    color:#fff;
    padding:12px 20px;
    border-radius:12px;
    font-size:14px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:9999;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:850px){

    main{
        padding:50px 18px 70px;
    }

    .header-inner{
        padding:17px 18px;
    }

    .header-button{
        padding:10px 13px;
        font-size:12px;
    }

    .logo-text{
        font-size:24px;
    }

    .hero{
        grid-template-columns:1fr;
        gap:30px;
        margin-bottom:55px;
    }

    .hero h1{
        font-size:48px;
        letter-spacing:-2px;
    }

    .payment-layout{
        grid-template-columns:1fr;
    }

    .details{
        grid-template-columns:1fr;
    }

    .after-payment{
        flex-direction:column;
        align-items:flex-start;
    }

    .support-button{
        width:100%;
        text-align:center;
    }
}

@media(max-width:500px){

    .hero h1{
        font-size:40px;
    }

    .hero-card{
        min-height:280px;
        border-radius:25px;
    }

    .card{
        padding:22px;
    }

    .amount-box{
        flex-direction:column;
        align-items:flex-start;
    }

    .primary-button,
    .secondary-button{
        width:100%;
    }
}
</style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">

            <div class="logo-symbol"></div>

            <div>
                <div class="logo-text">
                    VALOR<span>A</span>
                </div>

                <div class="logo-subtitle">
                    Tu aliado financiero.
                </div>
            </div>

        </div>

        <a
            id="topSupport"
            class="header-button"
            href="#"
            target="_blank"
        >
            Contactar
        </a>

    </div>

</header>


<main>

    <section class="hero">

        <div>

            <div
                id="eyebrowText"
                class="hero-label"
            ></div>

            <h1 id="pageTitle"></h1>

            <p
                id="pageDescription"
                class="hero-description"
            ></p>

            <div class="hero-actions">

                <a
                    id="heroSupport"
                    class="primary-button"
                    href="#"
                    target="_blank"
                ></a>

                <a
                    class="secondary-button"
                    href="#payment"
                >
                    Ver datos de pago ↓
                </a>

            </div>

        </div>


        <div class="hero-card">

            <div class="hero-card-logo"></div>

            <h2 id="heroCardTitle"></h2>

            <p id="heroCardText"></p>

        </div>

    </section>


    <section id="payment">

        <div class="payment-heading">

            <h2 id="paymentTitle"></h2>

            <p id="paymentSubtitle"></p>

        </div>


        <div class="payment-layout">


            <div class="card">

                <h3
                    id="bankSectionTitle"
                    class="card-title"
                ></h3>


                <div id="details" class="details"></div>


                <div class="amount-box">

                    <div>

                        <div
                            id="amountLabel"
                            class="amount-label"
                        ></div>

                        <div
                            id="amountValue"
                            class="amount-value"
                        ></div>

                    </div>

                </div>

            </div>


            <div class="card info-card">

                <div class="info-icon">
                    ✓
                </div>

                <h3>
                    Revisa tus datos
                </h3>

                <p>
                    Verifica cuidadosamente el banco,
                    titular, número de cuenta, Cédula,
                    referencia e importe antes de
                    confirmar la operación.
                </p>

            </div>

        </div>


        <div class="after-payment">

            <div>

                <h3 id="afterPaymentTitle"></h3>

                <p id="afterPaymentText"></p>

            </div>

            <a
                id="afterPaymentButton"
                class="support-button"
                href="#"
                target="_blank"
            ></a>

        </div>

    </section>

</main>


<footer>

    <div class="footer-logo">
        VALOR<span>A</span>
    </div>

    <div id="footerText"></div>

</footer>


<div
    id="toast"
    class="toast"
>
    Copiado
</div>


<script src="config.js"></script>

<script>

function $(id){
    return document.getElementById(id);
}


function esc(value){

    return String(value ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
}


async function copyText(value){

    try{

        await navigator.clipboard.writeText(value);

        showToast('Copiado');

    }catch(e){

        const textarea =
            document.createElement('textarea');

        textarea.value = value;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand('copy');

        textarea.remove();

        showToast('Copiado');
    }
}


function showToast(text){

    const toast = $('toast');

    toast.textContent = text;

    toast.classList.add('show');

    clearTimeout(window._toast);

    window._toast = setTimeout(
        () => toast.classList.remove('show'),
        1800
    );
}


function render(C){

    document.title =
        `VALORA — ${C.paymentTitle || 'Información de pago'}`;


    $('eyebrowText').textContent =
        C.eyebrow || '';

    $('pageTitle').textContent =
        C.pageTitle || '';

    $('pageDescription').textContent =
        C.pageDescription || '';


    $('heroCardTitle').textContent =
        C.heroCardTitle || '';

    $('heroCardText').textContent =
        C.heroCardText || '';


    $('paymentTitle').textContent =
        C.paymentTitle || '';

    $('paymentSubtitle').textContent =
        C.paymentSubtitle || '';

    $('bankSectionTitle').textContent =
        C.bankSectionTitle || 'Información bancaria';

    $('amountLabel').textContent =
        C.amountLabel || 'Importe';


    $('afterPaymentTitle').textContent =
        C.afterPaymentTitle || '';

    $('afterPaymentText').textContent =
        C.afterPaymentText || '';

    $('footerText').textContent =
        C.footer || '';


    $('topSupport').href =
        C.telegram || '#';

    $('topSupport').textContent =
        C.topSupportButton || 'Contactar';


    $('heroSupport').href =
        C.telegram || '#';

    $('heroSupport').textContent =
        C.sendReceiptButton || 'Enviar comprobante';


    $('afterPaymentButton').href =
        C.telegram || '#';

    $('afterPaymentButton').textContent =
        C.supportButton || 'Contactar soporte';


    $('amountValue').textContent =
        `${C.amount || '—'} ${C.currency || ''}`;


    const rows = [

        ['Banco', C.bank],

        ['Titular', C.accountHolder],

        ['Número de cuenta', C.accountNumber],

        ['Cédula', C.swift],

        ['Referencia', C.reference]

    ];


    $('details').innerHTML = rows.map(
        ([label,value]) => `

            <div class="detail">

                <span class="detail-label">
                    ${esc(label)}
                </span>

                <div class="detail-value">

                    <span>
                        ${esc(value || '—')}
                    </span>

                    ${
                        value
                        ?
                        `<button
                            class="copy-btn"
                            type="button"
                            onclick='copyText(${JSON.stringify(String(value))})'
                        >
                            Copiar
                        </button>`
                        :
                        ''
                    }

                </div>

            </div>

        `
    ).join('');
}


if(typeof loadConfig === 'function'){

    loadConfig()
        .then(render)
        .catch(error => {

            console.error(
                'Error al cargar la configuración:',
                error
            );

        });

}else{

    console.error(
        'No se encontró loadConfig(). Revisa config.js'
    );

}

</script>

</body>
</html>
